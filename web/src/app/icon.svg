<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="cp_shield_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="cp_border_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6798ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cp_diamond" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6798ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="cp_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6798ff" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Hexagonal Shield Frame -->
  <path d="M24 3.5 L40.5 11.5 V25.5 C40.5 34.5 33 41.5 24 44.5 C15 41.5 7.5 34.5 7.5 25.5 V11.5 Z" 
        fill="url(#cp_shield_bg)" 
        stroke="url(#cp_border_glow)" 
        stroke-width="2.2" 
        stroke-linejoin="round" />

  <!-- Equivalence Principle Validator Triad Nodes -->
  <circle cx="24" cy="8" r="1.8" fill="#38bdf8" />
  <circle cx="35" cy="15" r="1.5" fill="#6798ff" />
  <circle cx="13" cy="15" r="1.5" fill="#6798ff" />

  <!-- Stylized Faceted Critique Diamond Stake (Central Oracle Prism) -->
  <path d="M24 13 L33 21 L24 35 L15 21 Z" 
        fill="url(#cp_diamond)" 
        fill-opacity="0.28" 
        stroke="#6798ff" 
        stroke-width="1.4" 
        stroke-linejoin="round" />

  <!-- Central Proof Horizon Facet Lines -->
  <path d="M15 21 H33" stroke="#6798ff" stroke-width="1" stroke-opacity="0.6" />
  <path d="M24 13 V35" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

  <!-- The Autonomous Verification Checkmark (Truth Verdict) -->
  <path d="M18.5 24.5 L22.5 28.5 L30 19" 
        stroke="#ffffff" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#cp_glow)" />

  <!-- Speech/Critique Spur at Bottom Right (Consumer Feedback Motif) -->
  <path d="M30 33.5 L36 38.5 L33 30.5" 
        fill="#38bdf8" 
        fill-opacity="0.4" 
        stroke="#38bdf8" 
        stroke-width="1.2" 
        stroke-linejoin="round" />
</svg>
